services:
  db:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: kargo_sistemi
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    depends_on:
      - db
    environment:
      MONGO_URI: mongodb://db:27017/
      MONGO_DB_NAME: kargo_sistemi
      SERVER_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  mongo_data:
