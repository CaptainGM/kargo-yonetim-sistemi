<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Explorer | LogiRoute Lojistik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #111827;
            --surface-elevated: #1e293b;
            --border: #334155;
            --mongo: #10b981;
            --mongo-dark: #059669;
            --mongo-glow: rgba(16, 185, 129, 0.25);
            --primary: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --badge-bg: #1e293b;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #06b6d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.8), rgba(30, 41, 59, 0.8));
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mongo-logo-badge {
            width: 48px;
            height: 48px;
            background: var(--mongo-glow);
            border: 1px solid var(--mongo);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--mongo);
        }

        .header-title-box h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .conn-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--mongo);
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--surface-elevated);
            border-color: var(--text-secondary);
        }

        .btn-mongo {
            background: var(--mongo);
            color: #0b0f19;
            font-weight: 700;
            box-shadow: 0 4px 14px var(--mongo-glow);
        }

        .btn-mongo:hover {
            background: #059669;
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Koleksiyon Sekmeleri */
        .collection-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: var(--surface-elevated);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(16, 185, 129, 0.2));
            border-color: var(--mongo);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.15);
        }

        .tab-badge {
            background: var(--badge-bg);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab-btn.active .tab-badge {
            background: var(--mongo);
            color: #0b0f19;
            border-color: var(--mongo);
            font-weight: 700;
        }

        /* Kart ve Tablo */
        .content-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .card-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(30, 41, 59, 0.4);
        }

        .search-box {
            position: relative;
            max-width: 320px;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--mongo);
        }

        .view-toggles {
            display: flex;
            gap: 6px;
        }

        .view-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .view-btn.active {
            background: var(--surface-elevated);
            color: #ffffff;
            border-color: var(--mongo);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: #151d2f;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
            color: var(--text-primary);
        }

        tr:hover td {
            background: rgba(30, 41, 59, 0.5);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .pill-admin { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .pill-user { background: rgba(99, 102, 241, 0.15); color: var(--primary); border: 1px solid rgba(99, 102, 241, 0.3); }
        .pill-success { background: rgba(16, 185, 129, 0.15); color: var(--mongo); border: 1px solid rgba(16, 185, 129, 0.3); }
        .pill-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .pill-depot { background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2)); color: #fca5a5; border: 1px solid #ef4444; }

        .json-viewer {
            display: none;
            padding: 20px;
            background: #070a12;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #a5f3fc;
            overflow: auto;
            max-height: 600px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: var(--border);
        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header-bar">
            <div class="header-title-box">
                <div class="mongo-logo-badge">
                    <i class="fas fa-leaf"></i>
                </div>
                <div>
                    <h1>LogiRoute <span>MongoDB Explorer</span></h1>
                    <div class="conn-pill">
                        <i class="fas fa-circle" style="font-size: 8px;"></i> mongodb://localhost:27017/kargo_sistemi
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <a href="/" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Ana Sayfa
                </a>
                <button class="btn btn-mongo" onclick="fetchData()">
                    <i class="fas fa-sync-alt" id="refreshIcon"></i> Verileri Yenile
                </button>
            </div>
        </header>

        <!-- Koleksiyonlar -->
        <nav class="collection-tabs" id="collectionTabs">
            <!-- Dinamik yüklenecek -->
        </nav>

        <!-- İçerik Kartı -->
        <main class="content-card">
            <div class="card-toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Belgelerde ara..." oninput="filterTable()">
                </div>
                <div class="view-toggles">
                    <button class="view-btn active" id="btnTableView" onclick="setViewMode('table')">
                        <i class="fas fa-table"></i> Tablo
                    </button>
                    <button class="view-btn" id="btnJsonView" onclick="setViewMode('json')">
                        <i class="fas fa-code"></i> JSON
                    </button>
                </div>
            </div>

            <div id="tableView" class="table-responsive">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>MongoDB verileri yükleniyor...</p>
                </div>
            </div>

            <pre id="jsonView" class="json-viewer"></pre>
        </main>

        <footer class="footer-note">
            LogiRoute Platformu | MongoDB Document & Schema Inspector | 2026
        </footer>
    </div>

    <script>
        let fullData = {};
        let currentCollection = 'stations';
        let currentView = 'table';

        const collectionIcons = {
            'stations': 'fa-warehouse',
            'vehicles': 'fa-truck-moving',
            'cargos': 'fa-boxes',
            'routes': 'fa-route',
            'users': 'fa-users',
            'parameters': 'fa-sliders-h',
            'password_reset_codes': 'fa-key'
        };

        async function fetchData() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('fa-spin');

            try {
                const res = await fetch('/api/db-data');
                const data = await res.json();
                fullData = data;
                renderTabs();
                renderCollection(currentCollection);
            } catch (err) {
                console.error(err);
                document.getElementById('tableView').innerHTML = `
                    <div class="empty-state" style="color:var(--danger)">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Veriler yüklenirken hata oluştu: ${err.message}</p>
                    </div>`;
            } finally {
                setTimeout(() => icon.classList.remove('fa-spin'), 400);
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('collectionTabs');
            const collections = Object.keys(fullData).filter(k => k !== 'success');

            if (!collections.includes(currentCollection) && collections.length > 0) {
                currentCollection = collections[0];
            }

            let html = '';
            collections.forEach(col => {
                const count = Array.isArray(fullData[col]) ? fullData[col].length : 0;
                const icon = collectionIcons[col] || 'fa-database';
                const isActive = col === currentCollection ? 'active' : '';

                html += `
                    <button class="tab-btn ${isActive}" onclick="selectCollection('${col}')">
                        <i class="fas ${icon}"></i>
                        <span>${col}</span>
                        <span class="tab-badge">${count}</span>
                    </button>
                `;
            });

            tabsContainer.innerHTML = html;
        }

        function selectCollection(col) {
            currentCollection = col;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCollection(col);
        }

        function renderCollection(col) {
            const list = fullData[col] || [];
            document.getElementById('jsonView').textContent = JSON.stringify(list, null, 2);

            const tableContainer = document.getElementById('tableView');

            if (!list || list.length === 0) {
                tableContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>'${col}' koleksiyonunda henüz kayıt bulunmamaktadır.</p>
                    </div>`;
                return;
            }

            // Tablo sütun başlıkları
            const keys = Object.keys(list[0]).filter(k => k !== '_mongo_id');
            let ths = keys.map(k => `<th>${k}</th>`).join('');
            
            let rows = list.map(item => {
                let tds = keys.map(k => {
                    let val = item[k];
                    if (val === null || val === undefined) return '<td style="color:var(--text-muted)">-</td>';
                    
                    // Özel biçimlendirme
                    if (k === 'role') {
                        return `<td><span class="pill pill-${val}">${val}</span></td>`;
                    }
                    if (k === 'is_depot' && val) {
                        return `<td><span class="pill pill-depot"><i class="fas fa-star"></i> DEPO</span></td>`;
                    }
                    if (k === 'is_active' || k === 'is_owned') {
                        return `<td><span class="pill pill-${val ? 'success' : 'danger'}">${val ? 'Evet' : 'Hayır'}</span></td>`;
                    }
                    if (k === 'status') {
                        const isPend = val === 'pending';
                        return `<td><span class="pill pill-${isPend ? 'danger' : 'success'}">${val}</span></td>`;
                    }
                    if (Array.isArray(val) || typeof val === 'object') {
                        return `<td><code style="font-size:11px">${JSON.stringify(val).substring(0, 50)}...</code></td>`;
                    }
                    return `<td>${val}</td>`;
                }).join('');
                return `<tr>${tds}</tr>`;
            }).join('');

            tableContainer.innerHTML = `
                <table>
                    <thead><tr>${ths}</tr></thead>
                    <tbody id="tableBody">${rows}</tbody>
                </table>
            `;
        }

        function setViewMode(mode) {
            currentView = mode;
            const btnTable = document.getElementById('btnTableView');
            const btnJson = document.getElementById('btnJsonView');
            const tableView = document.getElementById('tableView');
            const jsonView = document.getElementById('jsonView');

            if (mode === 'table') {
                btnTable.classList.add('active');
                btnJson.classList.remove('active');
                tableView.style.display = 'block';
                jsonView.style.display = 'none';
            } else {
                btnJson.classList.add('active');
                btnTable.classList.remove('active');
                tableView.style.display = 'none';
                jsonView.style.display = 'block';
            }
        }

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(r => {
                r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        // Başlat
        fetchData();
    </script>
</body>
</html>
